server:
  port: ":8081"

service:
  name: "targeting-engine"

redis:
  host     : "127.0.0.1:7005"
  db       : 0
  poolSize : 1000

postgresql:
  debugMode: true
  database: "crud"
  maxOpenConns: 10
  maxIdleConns: 2
  master:
    host: "127.0.0.1"
    port: "5433"
    username: "admin"
    password: "admin"
  slaves:
    hosts: "127.0.0.1"
    port: "5433"
    username: "admin"
    password: "admin"

cache:
  defaultExpiration: "5m"
  cleanupInterval: "10m"
